# ── Terminal ───────────────────────────────────────────────────
set -g  default-terminal   "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -ag terminal-features  "*:hyperlinks"
set -g  focus-events       on

# ── General ────────────────────────────────────────────────────
set -g  prefix             C-Space
bind    C-Space            send-prefix
set -g  mouse              on
set -g  base-index         1
set -g  pane-base-index    1
set -g  renumber-windows   on
set -g  automatic-rename   on
set -g  history-limit      50000
set -g  display-time       3000
set -g  escape-time        0
set -g  set-clipboard      on

# ── Status bar ─────────────────────────────────────────────────
set -g  status             on
set -g  status-interval    2
set -g  status-position    bottom
set -g  monitor-activity   on
set -g  visual-activity    off
set -g  clock-mode-style   24

# ── Keybindings ────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded!"

# Splits preserve cwd
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Re-layout existing panes (no new pane) — shift = rearrange, unshifted = split
bind | select-layout even-horizontal \; display-message "  Columns"
bind _ select-layout even-vertical   \; display-message "  Rows"

bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom toggle with feedback message
bind z resize-pane -Z \; display-message "#{?window_zoomed_flag,  zoom on,  zoom off}"

# Window jump — Option+1..5 (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode — vi
set -g mode-keys vi
bind -T copy-mode-vi v                  send-keys -X begin-selection
bind -T copy-mode-vi y                  send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-pipe-and-cancel "pbcopy"

# Layouts
bind b   set-option -g status
bind D   run-shell "~/.tmux/layouts/dev.sh"  \; display-message "  Dev layout"
bind @   run-shell "~/.tmux/layouts/2.sh" \; display-message "  2 columns"
bind '#' run-shell "~/.tmux/layouts/3.sh" \; display-message "  3 columns"

# prefix + L → prompt "layout:" → ~/.tmux/layouts/<name>.sh
bind L command-prompt -p "layout:" "run-shell '~/.tmux/layouts/%1.sh'"

# Widgets — toggle individual status-right segments on/off
bind W run-shell "~/.tmux/scripts/widgets-menu.sh"

# Lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -S "fg=#262626" -s "bg=#101010" -E "lazygit"

# Sesh — requires sesh + fzf
bind s run-shell "sesh connect \"$(~/.tmux/scripts/sesh-list-claude.sh | fzf-tmux -p 55%,60% --no-sort --ansi --border-label ' sesh ' --prompt '  ' --color='bg+:#1a1a1a,bg:#101010,spinner:#ff8080,hl:#ff8080,fg:#ffffff,header:#808080,info:#b3a3ff,pointer:#ff8080,marker:#ff8080,fg+:#ffffff,prompt:#ff8080,hl+:#ff8080,border:#262626,label:#808080,query:#ffffff')\""

# VPN — prefix + V opens a menu (connect / disconnect / status / logs)
bind V display-menu -T "#[fg=#ff8080] VPN " -x C -y C \
  "Connect"    c "run-shell '~/.tmux/scripts/vpn-ctl.sh connect'" \
  "Disconnect" d "run-shell '~/.tmux/scripts/vpn-ctl.sh disconnect'" \
  "Status"     s "run-shell '~/.tmux/scripts/vpn-ctl.sh status'" \
  "" \
  "Logs"       l "display-popup -E -w 80% -h 80% 'tail -n 200 -f /tmp/vpn.log'"

# Sieć — prefix + N: pomiar łącza, szczegóły połączenia, survey pokoi
bind N display-menu -T "#[fg=#ff8080] net " -x C -y C \
  "Speedtest"    s "display-popup -E -w 70% -h 60% '~/.tmux/scripts/net-ctl.sh speedtest'" \
  "Szczegóły"    d "display-popup -E -w 70% -h 60% '~/.tmux/scripts/net-ctl.sh details'" \
  "" \
  "Survey pokoi" v "display-popup -E -w 90% -h 90% '~/.tmux/scripts/net-ctl.sh survey'"

# ── Plugins (TPM) ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore               'on'
set -g @continuum-save-interval         '10'

set -g @tmux-fzf-launch-key 'F'
TMUX_FZF_PREVIEW=1

set -g @thumbs-key      Space
set -g @thumbs-alphabet colemak-homerow
set -g @thumbs-command  'echo -n {} | pbcopy'

run '~/.tmux/plugins/tpm/tpm'

# ── Vesper theme (overrides — must run after TPM) ──────────────
set -g status-style                "bg=default,fg=#ffffff"
set -g status-left-style           "bg=default,fg=#ffffff"
set -g status-right-style          "bg=default,fg=#ffffff"
set -g window-status-style         "bg=default,fg=#4e4e4e"
set -g window-status-current-style "bg=default,fg=#ffffff,bold"
set -g window-status-activity-style "bg=default,fg=#ffffff"
set -g message-style               "bg=#101010,fg=#ffffff"
set -g message-command-style       "bg=#101010,fg=#ffffff"

set -g pane-border-style        fg="#1e1e1e"
set -g pane-active-border-style fg="#ff8080"

# Trailing ● when a Claude pane in this window finished (done=green) or waits
# for input (waiting=orange). Flag @claude-state is set by claude-tmux-notify.sh
# and cleared by the pane-focus-in hook below.
set -g window-status-format          "#I #W#{?@claude-state, #{?#{==:#{@claude-state},waiting},#[fg=#ffaf5f],#[fg=#87d787]}●#[fg=#4e4e4e],}"
set -g window-status-current-format  "#[fg=#ffffff,bold]#I #W"
set -g window-status-separator       "   "

# Entering a window clears its Claude dot (focus-events is on). Fires when a
# pane in the window gains focus — i.e. exactly when you switch to it.
set-hook -g pane-focus-in 'set -uw @claude-state'

set -g status-left-length  50
set -g status-right-length 250
set -g status-interval     1

set -g status-left "#{?client_prefix,#[fg=#ff8080]#[bold]● #S,#[fg=#808080]○ #S}#[default]#(~/.tmux/scripts/claude-other-sessions.sh '#{client_session}')   #{?window_zoomed_flag,#[fg=#ff8080]#[bold]  zoom   ,}"

# Each widget is wrapped in #{?@hide-NAME,,...} so prefix + W can toggle it.
set -g status-right "#(/Users/maciek/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?@hide-music,,#(~/.tmux/scripts/music.sh)}#{?@hide-git,,#(~/.tmux/scripts/dir-git-status.sh '#{pane_current_path}')}#{?@hide-vpn,,#[fg=#4e4e4e]vpn #(~/.tmux/scripts/vpn.sh)  }#{?@hide-net,,#[fg=#4e4e4e]net #(~/.tmux/scripts/net-speed.sh)  }#{?@hide-claude,,#[fg=#4e4e4e]claude #(~/.tmux/scripts/claude-usage.sh)  }#{?@hide-battery,,#[fg=#4e4e4e]battery #(~/.tmux/scripts/battery.sh)  }#{?@hide-cpu,,#[fg=#4e4e4e]cpu #(~/.tmux/scripts/color-pct.sh "$(/Users/maciek/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)")  }#{?@hide-ram,,#[fg=#4e4e4e]ram #(~/.tmux/scripts/color-pct.sh "$(/Users/maciek/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)")  }#{?@hide-date,,#[fg=#4e4e4e]%Y-%m-%d }#{?@hide-time,,#[fg=#ffffff]%H:%M:%S}"
